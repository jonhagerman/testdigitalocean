name: Deploy to App Platform

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234, 1.2.3, latest). Blank = sha tag of the selected branch/tag's commit."
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="${INPUT_TAG:-sha-${GITHUB_SHA::7}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying ${REGISTRY}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Render app spec
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_CREDENTIALS: ${{ secrets.GHCR_CREDENTIALS }}
        run: |
          envsubst '${IMAGE_TAG} ${GHCR_CREDENTIALS}' < .do/app.yaml > app.rendered.yaml
          grep -v registry_credentials app.rendered.yaml

      - name: Deploy to App Platform
        run: doctl apps create --spec app.rendered.yaml --upsert --wait
