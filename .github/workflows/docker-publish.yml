name: Build and publish container

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (sanity check)
        run: dotnet build TestDigitalOcean.slnx -c Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release bundle (manifest.json + one app spec template per environment) is
      # what deploy.yml deploys. It pins the image by digest, so deploying or rolling back
      # to a build always gets exactly the image and spec that build produced.
      - name: Create release manifest
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release
          cp .do/app.qa.yaml .do/app.production.yaml release/
          spec() { jq -n --arg file "$1" --arg sha256 "$(sha256sum "release/$1" | cut -d' ' -f1)" '{file: $file, sha256: $sha256}'; }
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg registry "$REGISTRY" \
            --arg name "${IMAGE_NAME,,}" \
            --arg digest "$DIGEST" \
            --arg tags "$TAGS" \
            --argjson qaSpec "$(spec app.qa.yaml)" \
            --argjson productionSpec "$(spec app.production.yaml)" \
            '{
              schemaVersion: 2,
              app: "testdigitalocean",
              version: $version,
              commit: $commit,
              ref: $ref,
              build: { runId: ($runId | tonumber), runUrl: $runUrl, builtAt: $builtAt },
              image: {
                registry: $registry,
                name: $name,
                digest: $digest,
                tags: ($tags | split("\n") | map(select(length > 0) | split(":") | last))
              },
              specs: { qa: $qaSpec, production: $productionSpec }
            }' > release/manifest.json
          cat release/manifest.json
          {
            echo "### Release manifest"
            echo "Deploy with **Actions -> Deploy to App Platform**, build run ID \`$GITHUB_RUN_ID\` (QA first, then production)."
            echo '```json'
            cat release/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release/
          retention-days: 90
