# DigitalOcean App Platform spec for the production environment (app.qa.yaml is QA).
# This file is a template. Every build copies both specs into its release bundle alongside
# manifest.json (.github/workflows/docker-publish.yml), and .github/workflows/deploy.yml
# deploys the chosen environment's copy from the bundle, so a rollback restores the spec
# as well as the image.
# region and vpc are set at deploy time from .do/environments.yaml.
# ${IMAGE_DIGEST} is substituted at deploy time with the digest recorded in the manifest,
# pinning the exact image that was built rather than a mutable tag.
name: testdigitalocean

services:
  - name: web
    image:
      registry_type: GHCR
      registry: jonhagerman
      repository: testdigitalocean
      digest: ${IMAGE_DIGEST}
      # GHCR package is private. Format "username:token" (PAT with read:packages).
      # App Platform encrypts it after the first deploy.
      registry_credentials: ${GHCR_CREDENTIALS}
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 10
    envs:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
        scope: RUN_TIME

alerts:
  - rule: DEPLOYMENT_FAILED
